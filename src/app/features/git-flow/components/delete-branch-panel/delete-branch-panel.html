<div class="flex flex-col gap-3">
  <div class="flex flex-col gap-1.5">
    <label for="del-branch-name" class="text-[10px] font-semibold text-mute uppercase tracking-widest">// nome completo do branch</label>
    <div class="flex gap-2">
      <div class="relative flex-1 flex items-center">
        <span class="absolute left-3 text-danger text-sm select-none" aria-hidden="true">›</span>
        <input
          id="del-branch-name"
          name="del-branch-name"
          autocomplete="off"
          type="text"
          placeholder="feature/sustentacao-17433-relatorios"
          [ngModel]="store.deleteBranchName()"
          (ngModelChange)="store.deleteBranchName.set($event)"
          (keydown)="onKeydown($event)"
          [disabled]="store.running() || !store.selectedProject()"
          autofocus
          class="flex-1 px-3 py-2 pl-7 bg-void border border-rail-edge focus:border-danger text-ink text-sm font-medium placeholder-mute focus:outline-none transition-colors rounded-md"
        />
      </div>
      <app-button
        variant="solid"
        class="px-5 py-2 text-xs bg-danger hover:bg-danger/85"
        [disabled]="store.running() || !store.selectedProject() || !store.deleteBranchName().trim()"
        (clicked)="store.deleteBranch()"
      >
        {{ store.running() ? 'running...' : 'deletar -D' }}
      </app-button>
    </div>
  </div>
</div>
