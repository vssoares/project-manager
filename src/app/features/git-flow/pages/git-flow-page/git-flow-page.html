<div class="h-full flex flex-col gap-4 px-6 py-5 overflow-y-auto scrollbar-thin min-h-0">
  @if (update.updateInfo(); as info) {
    <app-update-overlay [info]="info" />
  }

  <div class="flex flex-col gap-4 shrink-0">
    <app-header />

    <app-project-selector />

    <div class="border-t border-rail-edge"></div>

    <div class="flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <app-mode-tabs />
        @if (store.mode() === 'hotfix') {
          <app-button
            variant="outline"
            class="px-3 py-1.5 text-[11px] tracking-widest uppercase"
            [disabled]="store.running() || !store.selectedProject()"
            (clicked)="store.openGitk()"
          >
            gitk master
          </app-button>
        }
      </div>

      @switch (store.mode()) {
        @case ('hotfix') {
          <div class="fade-in">
            <app-hotfix-panel />
          </div>
        }
        @case ('newbranch') {
          <div class="fade-in">
            <app-new-branch-panel />
          </div>
        }
        @case ('delbranch') {
          <div class="fade-in">
            <app-delete-branch-panel />
          </div>
        }
      }
    </div>
  </div>

  <app-console-output />

  <footer class="flex justify-end shrink-0">
    <span class="text-[10px] text-mute font-code tracking-widest">v{{ appVersion() }}</span>
  </footer>
</div>
